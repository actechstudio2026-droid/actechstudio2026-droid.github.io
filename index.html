<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Rivers | Links</title>

  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="glow-cursor" id="glowCursor"></div>

    <div class="container">

      <!-- ===== HEADER ===== -->
      <header class="profile">
        <!-- CAMBIAR: reemplazá el background-image de esta clase en el CSS (.profile-pic)
             o cambiá este div por <img src="tu-foto.jpg" alt="Alex Rivers"> -->
        <div class="profile-pic" role="img" aria-label="Foto de perfil"></div>

        <h1 class="username">Alex Rivers</h1>

        <p class="bio">
          Streamer y creador de contenido full-time 🎮 <br>
          En vivo mar/jue/sáb • Contacto de negocios abajo 👇
        </p>
      </header>

      <!-- ===== VIDEO DESTACADO ===== -->
      <section class="featured" aria-label="Video destacado">
        <h2 class="section-label">Último video</h2>
        <div class="video-wrapper">
          <!-- CAMBIAR: reemplazá el src por la URL real de YouTube embed,
               ej: https://www.youtube.com/embed/ID_DEL_VIDEO -->
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="Video destacado"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </section>

      <!-- ===== BOTONES DE REDES SOCIALES ===== -->
      <nav class="links" aria-label="Redes sociales">

        <!-- CAMBIAR: reemplazá href="#" por las URLs reales de cada perfil -->
        <a href="#" class="link-btn link-youtube" target="_blank" rel="noopener noreferrer">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>
          </span>
          <span class="link-text">YouTube</span>
        </a>

        <a href="#" class="link-btn link-tiktok" target="_blank" rel="noopener noreferrer">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8a4.6 4.6 0 0 1-3.8-4.6h-3.4v14.6a2.8 2.8 0 1 1-2-2.7V9.7a6.2 6.2 0 1 0 5.4 6.1V9.9a7.9 7.9 0 0 0 4.6 1.5V8a4.6 4.6 0 0 1-.8-2.2Z"/></svg>
          </span>
          <span class="link-text">TikTok</span>
        </a>

        <a href="#" class="link-btn link-instagram" target="_blank" rel="noopener noreferrer">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.05 2.1.25 2.6.45.65.25 1.1.55 1.6 1.05.5.5.8.95 1.05 1.6.2.5.4 1.4.45 2.6.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.05 1.2-.25 2.1-.45 2.6-.25.65-.55 1.1-1.05 1.6-.5.5-.95.8-1.6 1.05-.5.2-1.4.4-2.6.45-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.05-2.1-.25-2.6-.45-.65-.25-1.1-.55-1.6-1.05-.5-.5-.8-.95-1.05-1.6-.2-.5-.4-1.4-.45-2.6C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.05-1.2.25-2.1.45-2.6.25-.65.55-1.1 1.05-1.6.5-.5.95-.8 1.6-1.05.5-.2 1.4-.4 2.6-.45C8.4 2.2 8.8 2.2 12 2.2Zm0 1.8c-3.15 0-3.52 0-4.76.1-1 .05-1.55.2-1.9.35-.48.18-.82.4-1.18.76-.36.36-.58.7-.76 1.18-.15.35-.3.9-.35 1.9-.1 1.24-.1 1.61-.1 4.76s0 3.52.1 4.76c.05 1 .2 1.55.35 1.9.18.48.4.82.76 1.18.36.36.7.58 1.18.76.35.15.9.3 1.9.35 1.24.1 1.61.1 4.76.1s3.52 0 4.76-.1c1-.05 1.55-.2 1.9-.35.48-.18.82-.4 1.18-.76.36-.36.58-.7.76-1.18.15-.35.3-.9.35-1.9.1-1.24.1-1.61.1-4.76s0-3.52-.1-4.76c-.05-1-.2-1.55-.35-1.9a3.1 3.1 0 0 0-.76-1.18 3.1 3.1 0 0 0-1.18-.76c-.35-.15-.9-.3-1.9-.35C15.52 4 15.15 4 12 4Zm0 3.7a4.3 4.3 0 1 1 0 8.6 4.3 4.3 0 0 1 0-8.6Zm0 1.8a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5.5-2a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>
          </span>
          <span class="link-text">Instagram</span>
        </a>

        <a href="#" class="link-btn link-discord" target="_blank" rel="noopener noreferrer">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 5.3A18 18 0 0 0 15.9 4c-.2.4-.4.9-.6 1.3a16.6 16.6 0 0 0-6.6 0A9 9 0 0 0 8.1 4a18 18 0 0 0-4.4 1.3C1.2 9.4.6 13.4 1 17.3a18.1 18.1 0 0 0 5.5 2.7c.4-.6.8-1.3 1.1-2a11.7 11.7 0 0 1-1.8-.9l.4-.3a12.9 12.9 0 0 0 11.6 0l.4.3c-.6.3-1.2.6-1.8.9.3.7.7 1.4 1.1 2a18 18 0 0 0 5.5-2.7c.5-4.5-.7-8.5-3.7-12ZM8.7 14.8c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Zm6.6 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Z"/></svg>
          </span>
          <span class="link-text">Discord</span>
        </a>

        <!-- CAMBIAR: duplicá un bloque .link-btn para agregar más plataformas
             (Twitch, Twitter/X, Kick, etc.) -->

      </nav>

      <!-- ===== BOTÓN DE COMPARTIR ===== -->
      <button id="shareBtn" class="share-btn" type="button">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.1c-.8 0-1.4.3-2 .8l-6.6-3.9c.1-.3.1-.6.1-1s0-.7-.1-1L16 7.1c.5.5 1.2.8 2 .8a3 3 0 1 0-3-3c0 .3 0 .7.1 1L8.5 9.8a3 3 0 1 0 0 4.4l6.6 3.9c0 .3-.1.6-.1.9a3 3 0 1 0 3-3Z"/></svg>
        </span>
        Compartir esta página
      </button>

      <!-- Mensaje de confirmación (toast), se muestra con JS -->
      <div id="toast" class="toast" role="status" aria-live="polite">¡Enlace copiado! 🔗</div>

      <footer class="footer">
        <p>&copy; <span id="year"></span> Alex Rivers. Todos los derechos reservados.</p>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
